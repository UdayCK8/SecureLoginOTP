<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — SecureLoginOTP</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="change-password">
    <nav class="navbar">
        <div class="navbar-brand">🔐 SecureLoginOTP</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
    <div class="container">
        <div class="card">
            <div class="card-title">Change Password</div>
            <div class="card-subtitle">Update your password securely.</div>
            <div id="cpAlert" class="alert"></div>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="cpUsername" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" id="cpOldPassword" placeholder="Current password" required>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="cpNewPassword" placeholder="Min 8 chars, letter + digit" required>
                    <div class="form-hint">At least 8 characters with 1 letter and 1 digit.</div>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="cpConfirmPassword" placeholder="Re-enter new password" required>
                </div>
                <button type="submit" class="btn btn-primary">Change Password</button>
            </form>
            <div class="link-group"><a href="login.html">Back to Login</a></div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
