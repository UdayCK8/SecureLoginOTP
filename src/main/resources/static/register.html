<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — SecureLoginOTP</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="register">
    <nav class="navbar">
        <div class="navbar-brand">🔐 SecureLoginOTP</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
    <div class="container">
        <div class="card">
            <div class="card-title">Create Account</div>
            <div class="card-subtitle">Register to use the secure OTP login system.</div>
            <div id="registerAlert" class="alert"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="e.g. john_doe" required>
                    <div class="form-hint">4–20 characters: letters, digits, underscores.</div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Min 8 chars, letter + digit" required>
                    <div class="form-hint">At least 8 characters with 1 letter and 1 digit.</div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="you@example.com" required>
                    <div class="form-hint">OTP will be sent to this email during login.</div>
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>
            <div class="link-group">Already have an account? <a href="login.html">Log in</a></div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
